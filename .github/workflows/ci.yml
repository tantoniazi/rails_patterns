name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: rails
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rails -d core_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: core

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: core

      - name: Prepare database
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: rails
          RAILS_ENV: test
        run: bundle exec rails db:create db:schema:load

      - name: Run RSpec
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: rails
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret
          RAILS_ENV: test
        run: bundle exec rspec

      - name: RuboCop
        run: bundle exec rubocop

  test-consumer:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: rails
          POSTGRES_DB: consumer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rails -d consumer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: consumer

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: consumer

      - name: Prepare database
        env:
          CONSUMER_DATABASE_URL: postgres://rails:rails@localhost:5432/consumer_test
          RAILS_ENV: test
        run: bundle exec rails db:create db:schema:load

      - name: Run RSpec
        env:
          CONSUMER_DATABASE_URL: postgres://rails:rails@localhost:5432/consumer_test
          KAFKA_URL: localhost:9092
          RAILS_ENV: test
        run: bundle exec rspec

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          npm ci
          npm run build
